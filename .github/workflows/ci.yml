name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Track Cargo build cache
        uses: ./
        with:
          mode: start
          # Bootstrap with a published binary before this checkout is released.
          version: '0.2.1'
      - name: Configure Cargo wrapper
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - run: cargo test
      - name: Trim Cargo build cache
        uses: ./
        with:
          mode: trim
          budget: 4GiB

  layouts:
    name: Test against Cargo ${{ matrix.toolchain }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [beta, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Track Cargo build cache
        uses: ./
        with:
          mode: start
          # Bootstrap with a published binary before this checkout is released.
          version: '0.2.1'
      - name: Configure Cargo wrapper
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: End-to-end tests with the other cargo
        run: |
          STEWARD_TEST_CARGO="$(rustup +${{ matrix.toolchain }} which cargo)"
          RUSTC="$(rustup +${{ matrix.toolchain }} which rustc)"
          export STEWARD_TEST_CARGO RUSTC
          cargo test --test e2e --test ci --test warm_start
      - name: Trim Cargo build cache
        uses: ./
        with:
          mode: trim
          budget: 4GiB

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Track Cargo build cache
        uses: ./
        with:
          mode: start
          # Bootstrap with a published binary before this checkout is released.
          version: '0.2.1'
      - name: Configure Cargo wrapper
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Shellcheck
        run: shellcheck scripts/install.sh
      - name: Trim Cargo build cache
        uses: ./
        with:
          mode: trim
          budget: 4GiB

  install:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      # `sh` is dash on Ubuntu, which keeps the script POSIX. Setup runs
      # against the runner's own Cargo config, which is thrown away after.
      - name: Track Cargo build cache
        uses: ./
        with:
          mode: start
          # Bootstrap with a published binary before this checkout is released.
          version: '0.2.1'
      - name: Configure Cargo wrapper
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - run: sh scripts/install.sh --scan-root "$RUNNER_TEMP"
      - run: cargo steward --version
      - name: Trim Cargo build cache
        uses: ./
        with:
          mode: trim
          budget: 4GiB
