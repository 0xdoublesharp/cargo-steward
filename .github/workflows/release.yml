name: Release

# When a `v*` tag is pushed: builds a binary per platform on a native runner,
# publishes the crate to crates.io, and attaches
# `cargo-steward-<target>.tar.gz` and its `.sha256` to the GitHub release,
# which `scripts/install.sh --release` downloads.
#
# crates.io trusts this workflow (Trusted Publishing): the crate's settings
# there name repository `0xdoublesharp/cargo-steward`, workflow `release.yml`
# and environment `release`, and the job exchanges GitHub's OIDC token for a
# short-lived publish token. No API token is stored in the repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild binaries for (e.g. v0.1.0)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
          # Keep Intel builds on a native x86_64 runner.
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches the package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag $RELEASE_TAG doesn't match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=cargo-steward-${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/cargo-steward
          "$bin" --version
          mkdir -p staging dist
          cp "$bin" README.md LICENSE staging/
          tar -czf "dist/$name.tar.gz" -C staging cargo-steward README.md LICENSE
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-steward-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  crate:
    name: Publish to crates.io
    # A manual rebuild only replaces binaries for an existing tag.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Check whether this version is on crates.io already
        id: published
        run: |
          version=${GITHUB_REF_NAME#v}
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "cargo-steward release workflow" \
            "https://crates.io/api/v1/crates/cargo-steward/$version")
          if [ "$status" = 200 ]; then
            echo "cargo-steward $version is on crates.io already"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.skip != 'true'
        id: auth
      - run: cargo publish --locked
        if: steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: GitHub release
    needs: [build, crate]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (needs.crate.result == 'success' || needs.crate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cargo-steward-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Marketplace publication reminder
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo '### Finish Marketplace publication'
            echo ''
            printf -- '- [ ] Open the [release editor](https://github.com/%s/releases/edit/%s), select **Publish this Action to the GitHub Marketplace**, confirm categories and update the release.\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf -- '- [ ] Verify **%s** is offered on the [Marketplace listing](https://github.com/marketplace/actions/cargo-steward).\n' "$RELEASE_TAG"
            echo ''
            echo 'GitHub and crates.io publication alone do not finish the release.'
          } >> "$GITHUB_STEP_SUMMARY"
