[package]
name = "cargo-steward"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Keeps Cargo build output fast and bounded: stops the debug object-file leak, cleans stale and orphaned build directories, and checks your setup"
license = "MIT"
readme = "README.md"
keywords = ["cargo", "disk", "gc", "build", "cache"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
toml_edit = "0.25.19"

[dev-dependencies]
tempfile = "3.27.0"
